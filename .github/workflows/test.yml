name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}, ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mcp: ["mcp<2"]
        include:
          # oldest mcp that pyproject.toml allows
          - python-version: "3.10"
            mcp: "mcp==1.3.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . "${{ matrix.mcp }}" pytest
      - run: python -m pytest -q tests

  install:
    # Same command as the README Quick Start, run from this checkout.
    name: uvx install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv "mcp<2" pytest
      - name: Install and start the server (exits when stdin closes)
        run: uvx --from . mindpersona < /dev/null
      - run: python -m pytest -q tests/test_stdio_e2e.py
        env:
          MINDPERSONA_SERVER_CMD: uvx --from ${{ github.workspace }} mindpersona
