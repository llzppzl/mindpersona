name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
          - python: "3.11"
          - python: "3.12"
          - python: "3.13"
          # 允许的最旧 mcp 版本
          - python: "3.10"
            mcp: "mcp==1.3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -r platform/claude/requirements.txt pytest ${{ matrix.mcp }}
      - name: Test
        run: python -m pytest -v platform/claude/tests
