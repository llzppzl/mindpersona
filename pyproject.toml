[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindpersona"
version = "0.1.0"
description = "MCP server that adapts your AI assistant's tone and workflow to your MBTI type, and remembers your feedback."
readme = "readme.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.0 (July 2026) removed the decorator API that server.py uses. Lift the cap after porting.
    # 1.3 is the oldest release the tests pass with.
    "mcp>=1.3,<2",
    # cryptography 49+ ships no Intel macOS wheels, so installs there try to compile it and fail.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/llzppzl/mindpersona"

[project.scripts]
mindpersona = "mindpersona.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mindpersona"]

# skills/ 留在仓库根目录（Semantic Kernel、API、SaaS 都引用这个路径），打包时复制进 mindpersona/skills
[tool.hatch.build.targets.wheel.force-include]
"skills" = "mindpersona/skills"
