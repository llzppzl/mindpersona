[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindpersona"
version = "0.1.0"
description = "MCP server that adapts your AI assistant's tone and workflow to your MBTI type, and remembers your feedback."
readme = "readme.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://github.com/llzppzl/mindpersona"

[project.scripts]
mindpersona = "mindpersona.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mindpersona"]

# skills/ 留在仓库根目录（Semantic Kernel、API、SaaS 都引用这个路径），打包时复制进 mindpersona/skills
[tool.hatch.build.targets.wheel.force-include]
"skills" = "mindpersona/skills"
